<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>비밀번호 재설정</title></head>
<body style="margin:0;background:#F8F7F8;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#252126;">
<div style="padding:32px 16px;">
  <div style="max-width:560px;margin:auto;background:#FFFFFF;border:1px solid #E7E2E5;border-radius:18px;padding:32px;">
    <h1 style="margin:0 0 24px;color:#A50034;font-size:26px;">큐:시트</h1>
    <h2 style="font-size:20px;line-height:1.5;margin:0 0 20px;">비밀번호 재설정</h2>
    <p style="line-height:1.7;">안녕하세요, 큐:시트 운영사무국입니다.</p>
    <p style="line-height:1.7;">고객님의 큐:시트 계정에 대한 비밀번호 재설정이 요청되었습니다.</p>
    <p style="line-height:1.7;overflow-wrap:anywhere;">아래 버튼을 눌러 새 비밀번호를 설정해 주세요.</p>
    <div style="margin:28px 0;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#A50034;color:#FFFFFF;text-decoration:none;padding:14px 24px;border-radius:10px;font-weight:bold;">비밀번호 재설정하기</a></div>
    <p style="font-size:13px;color:#746B72;line-height:1.7;">직접 요청하지 않으셨다면 버튼을 누르지 않고 이 메일을 무시하셔도 됩니다. 새 비밀번호를 설정하기 전까지 기존 비밀번호는 변경되지 않습니다.</p>
    <hr style="border:0;border-top:1px solid #E7E2E5;margin:28px 0;">
    <p style="font-size:12px;color:#746B72;line-height:1.6;">큐:시트 · 자료 제출부터 발표와 심사까지</p>
  </div>
</div>

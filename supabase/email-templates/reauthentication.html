<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>본인 확인</title></head>
<body style="margin:0;background:#F8F7F8;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#252126;">
<div style="padding:32px 16px;">
  <div style="max-width:560px;margin:auto;background:#FFFFFF;border:1px solid #E7E2E5;border-radius:18px;padding:32px;">
    <h1 style="margin:0 0 24px;color:#A50034;font-size:26px;">큐:시트</h1>
    <h2 style="font-size:20px;line-height:1.5;margin:0 0 20px;">본인 확인</h2>
    <p style="line-height:1.7;">안녕하세요, 큐:시트 운영사무국입니다.</p>
    <p style="line-height:1.7;">계정의 중요한 작업을 계속하기 위해 본인 확인이 요청되었습니다.</p>
    <p style="line-height:1.7;overflow-wrap:anywhere;">요청하신 화면에 아래 인증번호를 입력해 주세요. 인증번호는 다른 사람에게 공유하지 마세요.</p>
    <div style="margin:28px 0;"><div style="background:#FFF0F4;border:1px solid #E8B4C4;border-radius:12px;padding:20px;text-align:center;color:#A50034;font-size:30px;font-weight:bold;letter-spacing:6px;">{{ .Token }}</div></div>
    <p style="font-size:13px;color:#746B72;line-height:1.7;">직접 본인 확인을 요청하지 않으셨다면 인증번호를 입력하거나 다른 사람에게 전달하지 마세요. 계정에 로그인하여 보안 상태를 확인해 주세요.</p>
    <hr style="border:0;border-top:1px solid #E7E2E5;margin:28px 0;">
    <p style="font-size:12px;color:#746B72;line-height:1.6;">큐:시트 · 자료 제출부터 발표와 심사까지</p>
  </div>
</div>
</body>
</html>
